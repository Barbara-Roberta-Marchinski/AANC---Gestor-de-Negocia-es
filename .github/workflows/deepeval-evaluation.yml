name: DeepEval Evaluation Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'data/deepeval_golden_dataset.json'
      - 'requirements.txt'
      - 'test_deepeval_golden_dataset.py'
      - '.github/workflows/deepeval-evaluation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'data/deepeval_golden_dataset.json'
      - 'requirements.txt'
      - 'test_deepeval_golden_dataset.py'
  workflow_dispatch:

jobs:
  evaluation:
    name: Run DeepEval Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest for evaluation tests
        run: |
          python -m pytest test_deepeval_golden_dataset.py -v --tb=short

      - name: Run DeepEval evaluation pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -c "
          from pathlib import Path
          from src.deepeval_evaluation import run_golden_dataset_evaluation
          import json
          
          results = run_golden_dataset_evaluation(
              Path('data/deepeval_golden_dataset.json'),
              output_dir=Path('evaluation_artifacts'),
              verbose=True,
              threshold=0.7
          )
          
          print('\\n' + '='*80)
          print('EVALUATION SUMMARY')
          print('='*80)
          print(f'Total Cases: {results[\"total_cases\"]}')
          print(f'Passed Cases: {results[\"passed_cases\"]}')
          print(f'Pass Rate: {results[\"pass_rate\"]}')
          print(f'Failed Cases: {results[\"total_cases\"] - results[\"passed_cases\"]}')
          print('='*80)
          "

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepeval-evaluation-report
          path: evaluation_artifacts/
          retention-days: 30
          if-no-files-found: warn

      - name: Comment PR with evaluation results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const artifactDir = 'evaluation_artifacts';
            
            let comment = '## 📊 DeepEval Evaluation Report\n\n';
            
            if (fs.existsSync(path.join(artifactDir, 'evaluation_summary.json'))) {
              const summary = JSON.parse(fs.readFileSync(path.join(artifactDir, 'evaluation_summary.json'), 'utf8'));
              comment += `### Summary\n`;
              comment += `- **Total Cases:** ${summary.total_cases}\n`;
              comment += `- **Approved Cases:** ${summary.approved_cases}\n`;
              comment += `- **Pass Rate:** ${(summary.pass_rate * 100).toFixed(1)}%\n`;
              comment += `- **Average Relevancy Score:** ${summary.average_scores.relevancy_score?.toFixed(4) || 'N/A'}\n`;
              comment += `- **Average Faithfulness Score:** ${summary.average_scores.faithfulness_score?.toFixed(4) || 'N/A'}\n\n`;
              
              if (summary.best_question) {
                comment += `✅ **Best Performing Question:** ${summary.best_question.question.substring(0, 60)}...\n`;
              }
              if (summary.worst_question) {
                comment += `⚠️ **Worst Performing Question:** ${summary.worst_question.question.substring(0, 60)}...\n`;
              }
            }
            
            comment += '\n📎 Full evaluation report available in artifacts.\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if evaluation did not pass
        if: failure()
        run: |
          echo "DeepEval evaluation failed. Check the report above."
          exit 1

  tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run all tests
        run: |
          python -m pytest test_*.py -v --tb=short --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
